name: Build and publish catalog PDF
permissions:
  contents: read
concurrency:
  group: uniq2me-pdf-nexus-publication
  cancel-in-progress: false
'on':
  workflow_dispatch:
    inputs:
      catalog_repository:
        description: CATALOG_REPOSITORY; public source repository
        type: choice
        required: true
        default: uniq2me
        options:
        - uniq2me
        - uniq2me-ai
      commit_sha:
        description: COMMIT_SHA; full commit containing the catalog JSON to use
        type: string
        required: true
      catalog_alias:
        description: CATALOG_ALIAS; output folder name such as main, dora, or nis2
        type: string
        required: true
        default: main
      template:
        description: PDF template to render
        type: choice
        required: true
        default: fullCatalog
        options:
        - fullCatalog
        - shortList
        - doraShort
        - nis2Full
      language:
        description: Language of the catalog content and PDF template labels
        type: choice
        required: true
        default: en
        options:
        - en
        - el
        - fr
        - de
      shortlist_mask:
        description: Required for shortList and doraShort; mask JSON path in the selected catalog commit
        type: string
        required: false
        default: ''
jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out PDF renderer
        uses: actions/checkout@v4

      - name: Validate commit SHA
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          if [[ ! "$COMMIT_SHA" =~ ^([0-9a-fA-F]{40}|[0-9a-fA-F]{64})$ ]]; then
            echo 'COMMIT_SHA must be a full 40- or 64-character Git SHA.' >&2
            exit 1
          fi

      - name: Check out public catalog source at exact commit
        id: source
        env:
          CATALOG_REPOSITORY: ${{ inputs.catalog_repository }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
          UNIQ2ME_TOKEN: ${{ secrets.UNIQ2ME_TOKEN }}
        run: |
          SOURCE_URL="https://github.com/stefanospetsios/${CATALOG_REPOSITORY}.git"
          if [[ "$CATALOG_REPOSITORY" == 'uniq2me-ai' ]]; then
            if [[ -z "$UNIQ2ME_TOKEN" ]]; then
              echo 'Set the UNIQ2ME_TOKEN Actions secret in uniq2me-pdf to read the private uniq2me-ai repository.' >&2
              exit 1
            fi
            AUTH_HEADER="$(printf 'x-access-token:%s' "$UNIQ2ME_TOKEN" | base64 --wrap=0)"
            git -c http.extraheader="AUTHORIZATION: basic ${AUTH_HEADER}" \
              clone --filter=blob:none --no-checkout "$SOURCE_URL" catalog
            unset AUTH_HEADER
          else
            git clone --filter=blob:none --no-checkout "$SOURCE_URL" catalog
          fi
          git -C catalog checkout --detach "$COMMIT_SHA"
          ACTUAL_SHA="$(git -C catalog rev-parse HEAD)"
          if [[ "$ACTUAL_SHA" != "$COMMIT_SHA" ]]; then
            echo "Requested $COMMIT_SHA but checked out $ACTUAL_SHA" >&2
            exit 1
          fi
          echo "commit=$ACTUAL_SHA" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes texlive-luatex texlive-latex-extra texlive-fonts-recommended tex-gyre qrencode
          python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Render dated PDF
        env:
          CATALOG_REPOSITORY: ${{ inputs.catalog_repository }}
          COMMIT_SHA: ${{ steps.source.outputs.commit }}
          CATALOG_ALIAS: ${{ inputs.catalog_alias }}
          TEMPLATE: ${{ inputs.template }}
          LANGUAGE: ${{ inputs.language }}
          SHORTLIST_MASK: ${{ inputs.shortlist_mask }}
        run: |
          BUILD_ARGS=(
            catalog
            --output dist
            --repository "$CATALOG_REPOSITORY"
            --commit "$COMMIT_SHA"
            --alias "$CATALOG_ALIAS"
            --template "$TEMPLATE"
            --language "$LANGUAGE"
            --date "$(date -u +%Y%m%d)"
          )
          if [[ "$TEMPLATE" == 'shortList' || "$TEMPLATE" == 'doraShort' ]]; then
            if [[ -z "$SHORTLIST_MASK" ]]; then
              echo "$TEMPLATE requires shortlist_mask, e.g. repo-sfs-masks/en/nis2.json" >&2
              exit 1
            fi
            BUILD_ARGS+=(--shortlist-mask "$SHORTLIST_MASK")
          elif [[ -n "$SHORTLIST_MASK" ]]; then
            echo 'shortlist_mask is only used by shortList and doraShort.' >&2
            exit 1
          fi
          python .github/scripts/build_catalog.py "${BUILD_ARGS[@]}"

      - name: Publish and verify public Nexus asset
        env:
          PDF_NEXUS_URL: ${{ vars.PDF_NEXUS_URL }}
          PDF_NEXUS_USERNAME: ${{ vars.PDF_NEXUS_USERNAME }}
          PDF_NEXUS_TOKEN: ${{ secrets.PDF_NEXUS_TOKEN }}
        run: python .github/scripts/publish_nexus.py dist
